<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" height="100%" style="background:#070b12; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#131b2e" stroke-width="0.75" />
      <circle cx="28" cy="28" r="1" fill="#1e293b" />
    </pattern>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
  </defs>

  <rect width="1000" height="540" fill="url(#grid)" />

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="url(#headerGrad)" font-size="22" font-weight="800" letter-spacing="0.5">
    MANAKIZHARCHI AI v2.0 — CONFIDENCE-GATED AGENT PIPELINE
  </text>
  <text x="500" y="59" text-anchor="middle" fill="#94a3b8" font-size="12.5">
    Two-Stage Async FastAPI + LangGraph Execution: Fast VADER Exit vs. Qdrant Hybrid RRF &amp; LLM Fallback
  </text>

  <!-- Step 1: Ingestion & Pydantic -->
  <rect x="38" y="95" width="205" height="110" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="140" y="122" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">1. Ingestion &amp; NLP Hygiene</text>
  <text x="140" y="143" text-anchor="middle" fill="#cbd5e1" font-size="11">Pydantic v2 Schema Validation</text>
  <text x="140" y="160" text-anchor="middle" fill="#94a3b8" font-size="10.5">HTML/URL/Elongation Stripping</text>
  <text x="140" y="177" text-anchor="middle" fill="#94a3b8" font-size="10.5">NLTK POS Tagging &amp; Chunking</text>
  <text x="140" y="194" text-anchor="middle" fill="#38bdf8" font-size="10">SHA-256 Normalized Cache Key</text>

  <!-- Step 2: Cache Check -->
  <rect x="295" y="95" width="185" height="110" rx="12" fill="url(#cardBg)" stroke="#06b6d4" stroke-width="1.5" />
  <text x="387" y="122" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="700">2. Async TTL Cache Gate</text>
  <text x="387" y="144" text-anchor="middle" fill="#cbd5e1" font-size="11">In-Memory OrderedDict LRU</text>
  <text x="387" y="162" text-anchor="middle" fill="#94a3b8" font-size="10.5">Cache Hit -&gt; Immediate Exit</text>
  <text x="387" y="182" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">&lt; 0.5 ms Latency</text>

  <!-- Step 3: Stage-1 VADER & Confidence Gate -->
  <rect x="532" y="95" width="220" height="110" rx="12" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5" />
  <text x="642" y="122" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">3. Stage-1 VADER + Gate</text>
  <text x="642" y="143" text-anchor="middle" fill="#cbd5e1" font-size="11">Calibrated Confidence (C1 &ge; 0.68)</text>
  <text x="642" y="160" text-anchor="middle" fill="#94a3b8" font-size="10.5">Checks Slang, Irony/Sarcasm,</text>
  <text x="642" y="177" text-anchor="middle" fill="#94a3b8" font-size="10.5">Mixed-Clause Polarity Variance</text>
  <text x="642" y="194" text-anchor="middle" fill="#fbbf24" font-size="10">LangGraph Conditional Edge</text>

  <!-- Fast Path Output -->
  <rect x="802" y="95" width="160" height="110" rx="12" fill="url(#cardBg)" stroke="#22c55e" stroke-width="1.7" />
  <text x="882" y="125" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">FAST PATH EXIT</text>
  <text x="882" y="146" text-anchor="middle" fill="#cbd5e1" font-size="11">Unambiguous (~70%)</text>
  <text x="882" y="164" text-anchor="middle" fill="#94a3b8" font-size="10.5">Zero Vector / LLM Cost</text>
  <text x="882" y="186" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">Sub-2ms Response</text>

  <!-- Top Arrows -->
  <line x1="243" y1="150" x2="290" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />
  <line x1="480" y1="150" x2="527" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />
  <line x1="752" y1="150" x2="797" y2="150" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- Animated Pulse Dot along Top Track -->
  <circle r="4" fill="#38bdf8">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M 140 150 L 387 150 L 642 150 L 882 150" />
  </circle>

  <!-- Escalation Edge from Stage 1 down to Stage 2 -->
  <path d="M 642 205 L 642 252 L 260 252 L 260 288" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowIndigo)" />
  <rect x="345" y="238" width="230" height="24" rx="6" fill="#1e1b4b" stroke="#6366f1" />
  <text x="460" y="254" text-anchor="middle" fill="#c7d2fe" font-size="10.5" font-weight="700">AMBIGUOUS / C1 &lt; 0.68 (~30%)</text>

  <!-- Step 4: Qdrant Hybrid RAG -->
  <rect x="85" y="295" width="340" height="135" rx="12" fill="url(#cardBg)" stroke="#818cf8" stroke-width="1.6" />
  <text x="255" y="324" text-anchor="middle" fill="#a5b4fc" font-size="13.5" font-weight="700">4. Stage-2 Qdrant Hybrid Retrieval</text>
  <text x="255" y="346" text-anchor="middle" fill="#cbd5e1" font-size="11.5">Dense Cosine Vectors (Qdrant) + Sparse BM25Okapi</text>
  <text x="255" y="366" text-anchor="middle" fill="#94a3b8" font-size="10.5">Reciprocal Rank Fusion (RRF, k = 60)</text>
  <text x="255" y="385" text-anchor="middle" fill="#94a3b8" font-size="10.5">Indexed Corpus: Gen-Z Slang, Sarcasm Cues,</text>
  <text x="255" y="402" text-anchor="middle" fill="#94a3b8" font-size="10.5">Mixed-Polarity Clauses &amp; Tanglish Idioms</text>
  <text x="255" y="420" text-anchor="middle" fill="#818cf8" font-size="10">Non-blocking Asyncio ThreadPool Execution</text>

  <!-- Step 5: Stage-2 LLM + Deterministic Fallback -->
  <rect x="495" y="295" width="420" height="135" rx="12" fill="url(#cardBg)" stroke="#c084fc" stroke-width="1.6" />
  <text x="705" y="324" text-anchor="middle" fill="#e879f9" font-size="13.5" font-weight="700">5. Stage-2 Semantic Reasoner &amp; Telemetry</text>
  <text x="705" y="346" text-anchor="middle" fill="#cbd5e1" font-size="11.5">Async Groq / Gemini LLM with Strict Pydantic Output</text>
  <text x="705" y="366" text-anchor="middle" fill="#94a3b8" font-size="10.5">Deterministic Semantic RAG Circuit-Breaker Fallback</text>
  <text x="705" y="386" text-anchor="middle" fill="#94a3b8" font-size="10.5">Resolves Sarcasm Flips, Slang Irony &amp; Clause Contrast</text>
  <text x="705" y="405" text-anchor="middle" fill="#22c55e" font-size="10.5" font-weight="600">Caches Verdict -&gt; Emits LangSmith &amp; Latency Telemetry</text>

  <line x1="425" y1="362" x2="490" y2="362" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowIndigo)" />

  <!-- Animated Pulse Dot along Stage 2 -->
  <circle r="4" fill="#c084fc">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M 642 205 L 642 252 L 260 252 L 260 362 L 705 362" />
  </circle>

  <!-- Bottom Footer Bar -->
  <rect x="38" y="460" width="924" height="52" rx="10" fill="#0d121d" stroke="#1e293b" />
  <text x="500" y="482" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">
    FastAPI Endpoints: POST /api/v2/analyze &bull; POST /api/v2/analyze/batch &bull; POST /api/v2/ingest &bull; POST /api/v2/social/analyze
  </text>
  <text x="500" y="501" text-anchor="middle" fill="#94a3b8" font-size="11">
    Built with Python (asyncio) &bull; LangGraph &bull; Qdrant &bull; VADER &bull; NLTK &bull; Pydantic v2 &bull; LangSmith
  </text>
</svg>
